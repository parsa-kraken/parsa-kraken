<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="936" viewBox="0 0 1664 936" preserveAspectRatio="xMidYMid meet">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020b07"/>
    <stop offset=".48" stop-color="#061812"/>
    <stop offset="1" stop-color="#02100a"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#102a1d" stop-opacity=".96"/>
    <stop offset="1" stop-color="#06150e" stop-opacity=".97"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#25ff78" stop-opacity="0"/>
    <stop offset=".5" stop-color="#8affb4"/>
    <stop offset="1" stop-color="#25ff78" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="greenText" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8affb4"/>
    <stop offset=".5" stop-color="#39ff82"/>
    <stop offset="1" stop-color="#8affb4"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0" stop-color="#39ff82" stop-opacity=".28"/>
    <stop offset=".45" stop-color="#1dff6b" stop-opacity=".08"/>
    <stop offset="1" stop-color="#1dff6b" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orb">
    <stop offset="0" stop-color="#39ff82" stop-opacity=".55"/>
    <stop offset="1" stop-color="#1dff6b" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#06150e" stop-opacity=".95"/>
    <stop offset=".5" stop-color="#0a2218" stop-opacity=".85"/>
    <stop offset="1" stop-color="#06150e" stop-opacity=".95"/>
  </linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#25ff78" stop-opacity="0"/>
    <stop offset=".5" stop-color="#8affb4"/>
    <stop offset="1" stop-color="#25ff78" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" fill="none" stroke="#6aff9c" stroke-opacity=".055"/>
    <circle cx="0" cy="0" r="1" fill="#8affb4" opacity=".18"/>
  </pattern>
  <pattern id="smallGrid" width="12" height="12" patternUnits="userSpaceOnUse">
    <path d="M12 0H0V12" fill="none" stroke="#7bffa9" stroke-opacity=".022"/>
  </pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <filter id="tinyGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2"/>
  </filter>

  <!-- Tech badge (shinobi style) -->
  <g id="badge">
    <rect x="-31" y="-31" width="62" height="62" rx="15"
          fill="#0c2117" stroke="#25ff78" stroke-opacity=".28"/>
    <rect x="-27" y="-27" width="54" height="54" rx="12"
          fill="none" stroke="#8affb4" stroke-opacity=".08"/>
    <circle r="21" fill="none" stroke="#52ff91" stroke-opacity=".11"/>
  </g>

  <!-- Pulsing status dot -->
  <g id="status">
    <circle r="4" fill="#73ffa5" filter="url(#tinyGlow)">
      <animate attributeName="r" values="2.5;5;2.5" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;1;.35" dur="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Corner decorations -->
  <g id="cornerTL">
    <path d="M0 30 V0 H30" fill="none" stroke="#25ff78" stroke-width="1.5" stroke-opacity=".5"/>
  </g>
  <g id="cornerTR">
    <path d="M0 30 V0 H-30" fill="none" stroke="#25ff78" stroke-width="1.5" stroke-opacity=".5"/>
  </g>
  <g id="cornerBL">
    <path d="M0 -30 V0 H30" fill="none" stroke="#25ff78" stroke-width="1.5" stroke-opacity=".5"/>
  </g>
  <g id="cornerBR">
    <path d="M0 -30 V0 H-30" fill="none" stroke="#25ff78" stroke-width="1.5" stroke-opacity=".5"/>
  </g>
</defs>
<rect width="1664" height="936" fill="url(#bg)"/>
<rect width="1664" height="936" fill="url(#grid)">
