<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0b1220"/>
    <stop offset="50%" stop-color="#0a1322"/>
    <stop offset="100%" stop-color="#0d1a30"/>
  </linearGradient>
  <radialGradient id="bgGlow" cx="50%" cy="0%" r="80%">
    <stop offset="0%" stop-color="#059669" stop-opacity="0.18"/>
    <stop offset="60%" stop-color="#059669" stop-opacity="0.04"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="barFill" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#059669"/>
    <stop offset="50%" stop-color="#22c55e"/>
    <stop offset="100%" stop-color="#4ade80"/>
  </linearGradient>
  <linearGradient id="barFillRed" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ef4444"/>
    <stop offset="100%" stop-color="#f87171"/>
  </linearGradient>
  <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#16a34a" stop-opacity="0.9"/>
    <stop offset="50%" stop-color="#4ade80" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#16a34a" stop-opacity="0.9"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#22c55e" stroke-width="0.4" stroke-opacity="0.06"/>
  </pattern>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#22c55e" opacity="0.025"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    text { font-family: 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','Courier New',Consolas,monospace; }
    .h1 { font-size: 26px; font-weight: 700; fill: #4ade80; letter-spacing: 2px; }
    .h2 { font-size: 18px; font-weight: 600; fill: #e2e8f0; letter-spacing: 1px; }
    .h3 { font-size: 14px; font-weight: 600; fill: #4ade80; letter-spacing: 0.5px; }
    .lbl { font-size: 11px; fill: #64748b; letter-spacing: 1.5px; text-transform: uppercase; }
    .val { font-size: 14px; fill: #e2e8f0; }
    .key { font-size: 13px; fill: #4ade80; font-weight: 600; }
    .pct { font-size: 11px; fill: #94a3b8; font-family: 'JetBrains Mono','Courier New',Consolas,monospace; }
    .meta { font-size: 11px; fill: #64748b; font-family: 'JetBrains Mono','Courier New',Consolas,monospace; }
    .arrow { fill: none; stroke: #22c55e; stroke-width: 1.5; }
  </style>
</defs>
<rect width="1180" height="660" fill="url(#bgGrad)"/>
<rect width="1180" height="660" fill="url(#grid)"/>
<rect width="1180" height="660" fill="url(#scanlines)"/>
<rect width="1180" height="660" fill="url(#bgGlow)"/>

