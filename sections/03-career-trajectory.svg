    CAREER TRAJECTORY
    <animate attributeName="opacity" values=".84;1;.84" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="832" y="123" fill="#6cff9d" font-size="15" letter-spacing="4" opacity=".72">
