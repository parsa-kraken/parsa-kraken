    .h2 { font-size: 18px; font-weight: 600; fill: #e2e8f0; letter-spacing: 1px; }
    .h3 { font-size: 14px; font-weight: 600; fill: #4ade80; letter-spacing: 0.5px; }
    .lbl { font-size: 11px; fill: #64748b; letter-spacing: 1.5px; text-transform: uppercase; }
    .val { font-size: 14px; fill: #e2e8f0; }
    .key { font-size: 13px; fill: #4ade80; font-weight: 600; }
    .pct { font-size: 11px; fill: #94a3b8; font-family: 'JetBrains Mono','Courier New',Consolas,monospace; }
    .meta { font-size: 11px; fill: #64748b; font-family: 'JetBrains Mono','Courier New',Consolas,monospace; }
    .arrow { fill: none; stroke: #22c55e; stroke-width: 1.5; }
  </style>
</defs>
